os: linux
dist: xenial

language: node_js

cache:
  apt: true
  directories:
    - node_modules
    - ~/.pnpm-store

before_install:
  - corepack enable
  - corepack prepare pnpm@10.22.0 --activate

install:
  - pnpm install

node_js:
  - 'lts/*'

script:
  - pnpm run lint
  - pnpm run test-cov

after_script:
  - pnpm exec coveralls < ./coverage/lcov.info
