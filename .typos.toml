[default]
# Project specific terms that should not be flagged.
extend-ignore-re = [
  "(?i)asciidoc",
  "(?i)asciidoctor",
  "(?i)hexo"
]

[files]
extend-exclude = [
  "pnpm-lock.yaml",
  ".mise.lock",
  "node_modules/**",
  "coverage/**",
  "dist/**",
  ".pnpm-store/**"
]

[type.changelog]
extend-glob = ["ChangeLog.md"]
extend-ignore-re = [
  # Ignore short git commit SHAs that appear in inline code, e.g. `daa954f`.
  "`[0-9a-f]{7,10}`"
]
