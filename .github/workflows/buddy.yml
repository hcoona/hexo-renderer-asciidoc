name: Buddy Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: 24.x
  PNPM_VERSION: 10.22.0

jobs:
  release:
    name: Package & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Determine npm dist-tag
        id: dist_tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#refs/tags/}"
          VERSION="${VERSION#v}"
          BASE_VERSION="${VERSION%%+*}"

          if [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            if [[ "$BASE_VERSION" == *-* ]]; then
              PRERELEASE_PART="${BASE_VERSION#*-}"
              CHANNEL="${PRERELEASE_PART%%.*}"
              CHANNEL="${CHANNEL:-next}"
            else
              CHANNEL="latest"
            fi
          else
            CHANNEL="latest"
          fi

          echo "Using dist-tag: $CHANNEL (derived from $RELEASE_TAG)"
          echo "tag=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm publish --access public --tag "${{ steps.dist_tag.outputs.tag }}"
